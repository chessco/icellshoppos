version: "3.9"

services:
  icellshop-postgres:
    image: postgres:16-alpine
    container_name: icellshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icellshop_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-icellshop_db}
    expose:
      - "5432"
    volumes:
      - icellshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icellshop_prod} -d ${POSTGRES_DB:-icellshop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - icellshop_net

  icellshop-probuyer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icellshop-probuyer
    restart: unless-stopped
    depends_on:
      icellshop-postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3007
      - NEXT_PUBLIC_APP_URL=https://probuyer.pitayacode.io
      - DATABASE_URL=postgresql://${POSTGRES_USER:-icellshop_prod}:${POSTGRES_PASSWORD}@icellshop-postgres:5432/${POSTGRES_DB:-icellshop_db}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET:-${SESSION_SECRET}}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    expose:
      - "3007"
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      icellshop_net:
      pitaya_net:
        aliases:
          - probuyer
          - icellshop-probuyer

networks:
  icellshop_net:
    external: true
  pitaya_net:
    external: true

volumes:
  icellshop_postgres_data:
    name: icellshop_postgres_data
