services:
  postgres:
    image: postgres:16-alpine
    container_name: icellshop_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: icellshop
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: icellshoppos_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_icellshop_local:/var/lib/postgresql/data

volumes:
  pgdata_icellshop_local:
