name: DIO Reminders Cron

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch:

jobs:
  send-dio-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call DIO Reminders Endpoint
        env:
          DIO_CRON_SECRET: ${{ secrets.DIO_CRON_SECRET }}
          DIO_CRON_URL: ${{ secrets.DIO_CRON_URL }}
        run: |
          if [ -z "$DIO_CRON_SECRET" ] || [ -z "$DIO_CRON_URL" ]; then
            echo "DIO_CRON_SECRET or DIO_CRON_URL not set in repository secrets." >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $DIO_CRON_SECRET" \
            "$DIO_CRON_URL"
