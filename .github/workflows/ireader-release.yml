name: iReader Windows Release

on:
  push:
    tags:
      - "ireader-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.artifact-info.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # GitHub's windows-latest runners sometimes have Windows Defender
      # quarantine/delete unsigned .exe files bundled inside node_modules
      # right after npm install (a known runner flakiness, not specific to
      # this repo) — this has been observed removing 7zip-bin's 7za.exe,
      # which electron-builder needs to build the NSIS installer.
      - name: Exclude workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      # Root install: electron-updater/electron-store/bplist-parser are
      # hoisted to the workspace root in this npm-workspaces monorepo (see
      # docs/PHASE_A6_AUTO_UPDATE_FOUNDATION_REPORT.md §3.1) — installing
      # from desktop/ alone would miss them.
      - name: Install workspace dependencies
        run: npm ci

      # Defensive re-check regardless of the Defender exclusion above: if
      # 7za.exe is still missing for any reason, reinstall just that
      # package rather than failing deep inside electron-builder.
      - name: Verify 7zip-bin binary is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "node_modules/7zip-bin/win/x64/7za.exe" ]; then
            echo "7za.exe missing after npm ci — reinstalling 7zip-bin..."
            npm install --no-save 7zip-bin
          fi
          test -f "node_modules/7zip-bin/win/x64/7za.exe" || { echo "::error::7za.exe still missing after reinstall"; exit 1; }

      - name: Build main/preload/renderer
        working-directory: desktop
        run: npm run build

      - name: Package Windows installer (NSIS)
        working-directory: desktop
        run: npm run dist:win

      - name: Validate required artifacts exist
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/latest.yml || { echo "::error::latest.yml was not generated"; exit 1; }
          exe_count=$(ls dist/*.exe 2>/dev/null | wc -l)
          [ "$exe_count" -ge 1 ] || { echo "::error::installer .exe was not generated"; exit 1; }
          blockmap_count=$(ls dist/*.exe.blockmap 2>/dev/null | wc -l)
          [ "$blockmap_count" -ge 1 ] || { echo "::error::.exe.blockmap was not generated"; exit 1; }
          echo "All required artifacts present."

      - name: Validate version consistency (package.json / latest.yml / tag)
        id: artifact-info
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          yml_version=$(grep -m1 '^version:' dist/latest.yml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          echo "desktop/package.json version: $pkg_version"
          echo "dist/latest.yml version:      $yml_version"
          if [ "$pkg_version" != "$yml_version" ]; then
            echo "::error::Version mismatch: package.json=$pkg_version latest.yml=$yml_version"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/ireader-v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/ireader-v}"
            echo "Git tag version: $tag_version"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::Git tag (ireader-v$tag_version) does not match desktop/package.json version ($pkg_version). Bump the version and re-tag."
              exit 1
            fi
          fi

          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ireader-windows-release
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          retention-days: 30
          if-no-files-found: error

  publish-hetzner:
    name: Publish to Hetzner
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ireader-windows-release
          path: desktop/dist

      # ssh-keyscan pins the real host key for this run rather than disabling
      # verification (no StrictHostKeyChecking=no) — see
      # docs/PHASE_B1_IREADER_PRODUCTION_DEPLOYMENT_REPORT.md §8.
      - name: Pin Hetzner host key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${HETZNER_PORT:-22}" "$HETZNER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Write temporary deploy key
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/ireader_deploy_key
          chmod 600 ~/.ssh/ireader_deploy_key

      - name: Publish artifacts to Hetzner (publish-hetzner.mjs)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT }}
          HETZNER_SSH_KEY_PATH: /home/runner/.ssh/ireader_deploy_key
        run: node desktop/scripts/publish-hetzner.mjs

      - name: Remove temporary deploy key
        if: always()
        run: rm -f ~/.ssh/ireader_deploy_key

  verify-remote:
    name: Verify Remote Release
    needs: [build-windows, publish-hetzner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify latest.yml is live and matches the published version
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/latest.yml -w "%{http_code}" https://probuyer.pitayacode.io/downloads/latest.yml)
          [ "$status" = "200" ] || { echo "::error::latest.yml returned HTTP $status"; exit 1; }
          cat /tmp/latest.yml

          remote_version=$(grep -m1 '^version:' /tmp/latest.yml | sed "s/version:[[:space:]]*//" | tr -d '\r"'"'"'')
          expected_version="${{ needs.build-windows.outputs.version }}"
          echo "remote version: $remote_version | expected: $expected_version"
          [ "$remote_version" = "$expected_version" ] || { echo "::error::Remote latest.yml shows $remote_version, expected $expected_version"; exit 1; }

      - name: Verify installer is reachable over HTTPS
        run: |
          set -euo pipefail
          installer_name=$(grep -m1 '^path:' /tmp/latest.yml | sed "s/path:[[:space:]]*//" | tr -d '\r"'"'"'')
          encoded=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$installer_name")
          url="https://probuyer.pitayacode.io/downloads/$encoded"
          status=$(curl -s -o /dev/null -w "%{http_code}" -I "$url")
          echo "installer: $url -> HTTP $status"
          [ "$status" = "200" ] || { echo "::error::Installer not reachable (HTTP $status)"; exit 1; }
          echo "installer_url=$url" >> "$GITHUB_ENV"

      - name: Verify HTTP Range request support (required by electron-updater)
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Range: bytes=0-99" "$installer_url")
          echo "Range request -> HTTP $status"
          [ "$status" = "206" ] || { echo "::error::Server did not honor Range request (got HTTP $status, expected 206)"; exit 1; }
